<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>XMRadar promo tile</title>
<style>
@font-face{font-family:'Manrope';font-style:normal;font-display:block;font-weight:200 800;src:url('../../site/fonts/manrope-latin-wght-normal.woff2') format('woff2-variations');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:440px;height:280px;overflow:hidden}
body{font-family:'Manrope',system-ui,sans-serif;color:#ecedf1;background:
  radial-gradient(300px 220px at 0% 0%,rgba(242,104,34,.22),transparent 65%),
  radial-gradient(320px 260px at 100% 100%,rgba(123,63,228,.30),transparent 65%),#0f1014;
  position:relative;padding:26px 28px;display:flex;flex-direction:column}
body::after{content:'';position:absolute;inset:0;opacity:.3;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(300px 220px at 50% 45%,#000 30%,transparent 90%)}
.top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.top img{width:28px;height:28px}
.top b{font-size:18px;font-weight:800;letter-spacing:-.02em}
h1{position:relative;z-index:1;margin-top:auto;font-size:29px;line-height:1.08;font-weight:800;letter-spacing:-.03em;max-width:360px;text-wrap:balance}
h1 em{font-style:normal;color:#f26822}
.sub{position:relative;z-index:1;margin-top:10px;font-size:12px;color:#a9aebd;font-weight:600}
</style></head>
<body>
  <div class="top"><img src="../../site/logo/xmradar.svg" alt=""><b>XMRadar</b></div>
  <h1>Monero on the pages <em>you use.</em></h1>
  <div class="sub">Tip badges on X · Swap safety · No keys, no funds</div>
</body></html>
