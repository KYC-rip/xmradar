      <div class="caption"><span class="dot"></span>The tip dialog: QR code, address, optional amount.</div>
    </div>
  </div>

  <div class="foot"><span class="dot"></span>No account · No analytics · No keys or funds<span class="right">XMRADAR FOR CHROME</span></div>
