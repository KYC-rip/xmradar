# The only way a release is made: push a tag vX.Y.Z that matches package.json, on a commit in main.
# The build number is this workflow's run number; nobody types it in.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release # add a required reviewer in the repo settings before store uploads
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation (public repos only)
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      PUBLIC: ${{ github.event.repository.visibility == 'public' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Tag must match package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          [ "v$PKG" = "$TAG" ] || { echo "tag $TAG != package.json $PKG"; exit 1; }

      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile

      - name: Build
        env:
          WXT_BUILD_NUMBER: ${{ github.run_number }}
          WXT_COMMIT: ${{ github.sha }}
          WXT_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: scripts/build-release.sh dist

      - name: Test built bundles
        env:
          XMRADAR_REQUIRE_BUILD: '1'
        run: pnpm test

      - name: Build signed Android APK
        working-directory: android
        env:
          # Tagged releases use offset 0 so versionCode matches metadata/rip.kyc.xmradar/en-US/changelogs/<versionCode>.txt
          XMRADAR_BUILD_OFFSET: '0'
          XMRADAR_KEYSTORE_BASE64: ${{ secrets.XMRADAR_KEYSTORE_BASE64 }}
          XMRADAR_KEYSTORE_PASSWORD: ${{ secrets.XMRADAR_KEYSTORE_PASSWORD }}
          XMRADAR_KEY_ALIAS: ${{ secrets.XMRADAR_KEY_ALIAS }}
          XMRADAR_KEY_PASSWORD: ${{ secrets.XMRADAR_KEY_PASSWORD }}
        run: |
          if [ -z "$XMRADAR_KEYSTORE_BASE64" ] || [ -z "$XMRADAR_KEYSTORE_PASSWORD" ] || [ -z "$XMRADAR_KEY_ALIAS" ] || [ -z "$XMRADAR_KEY_PASSWORD" ]; then
            echo "Refusing to cut an unsigned Android release APK: configure XMRADAR_KEYSTORE_* secrets in the release environment or repo settings." >&2
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/xmradar.jks"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          # Uses output/firefox-mv3 produced by scripts/build-release.sh (with WXT_COMMIT / WXT_RELEASE_URL intact)
          ./gradlew testDebugUnitTest lintVitalRelease --no-daemon
          umask 077
          echo "$XMRADAR_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          export XMRADAR_KEYSTORE_PATH="$KEYSTORE_FILE"
          ./gradlew assembleRelease --no-daemon
          VERSION=$(node -p "require('../package.json').version")
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "Expected signed release APK at $APK" >&2; exit 1; }
          APKSIGNER=$(ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          fi
          OUT="../dist/xmradar-${VERSION}-arm64-v8a.apk"
          cp "$APK" "$OUT"
          (cd ../dist && sha256sum "xmradar-${VERSION}-arm64-v8a.apk" >> SHA256SUMS)

      # Artifact attestations need a public repo on the free plan.
      - name: Attest build provenance
        if: env.PUBLIC == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.apk

      - name: Release notes
        run: |
          V="${TAG#v}.${{ github.run_number }}"
          {
            # this version's section of CHANGELOG.md, when there is one
            awk -v h="## ${TAG#v}" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md 2>/dev/null | sed -e '/./,$!d'
            if awk -v h="## ${TAG#v}" '$0 == h { f = 1 } END { exit !f }' CHANGELOG.md 2>/dev/null; then
              echo
              echo "All changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md)"
              echo
              echo '---'
              echo
            fi
            echo "Built by GitHub Actions run ${{ github.run_id }} (build ${{ github.run_number }}) from ${{ github.sha }}."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Check: rebuild the tag with \`scripts/build-release.sh\` on Ubuntu 24.04 with Node $(cat .nvmrc) and compare with SHA256SUMS."
            if [ "$PUBLIC" = true ]; then
              echo "Or check the signed provenance: \`gh attestation verify xmradar-$V-chrome.zip -R ${{ github.repository }}\`"
            fi
          } > dist/NOTES.md

      # A rerun after a partial failure finishes the same release with the new build. Its zip names carry the new
      # run number, so the old assets are removed first and the release only lists what SHA256SUMS describes.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" dist/*.zip dist/*.apk dist/SHA256SUMS
            gh release edit "$TAG" --notes-file dist/NOTES.md --title "XMRadar $TAG (build ${{ github.run_number }})"
          else
            gh release create "$TAG" dist/*.zip dist/*.apk dist/SHA256SUMS --notes-file dist/NOTES.md --title "XMRadar $TAG (build ${{ github.run_number }})"
          fi

      # Store uploads use the same zips, so the store copy hashes the same as the release.
      # - name: Chrome Web Store
      #   run: pnpm wxt submit --chrome-zip "dist/xmradar-${TAG#v}.${{ github.run_number }}-chrome.zip"
      #   env: { CHROME_EXTENSION_ID: ..., CHROME_CLIENT_ID: ..., CHROME_CLIENT_SECRET: ..., CHROME_REFRESH_TOKEN: ... }
      # - name: Firefox Add-ons
      #   run: pnpm wxt submit --firefox-zip "dist/xmradar-${TAG#v}.${{ github.run_number }}-firefox.zip" --firefox-sources-zip "dist/xmradar-${TAG#v}.${{ github.run_number }}-sources.zip"
      #   env: { FIREFOX_EXTENSION_ID: ..., FIREFOX_JWT_ISSUER: ..., FIREFOX_JWT_SECRET: ... }
