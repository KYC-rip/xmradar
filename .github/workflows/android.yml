# Builds and unit-tests the standalone Android / GrapheneOS GeckoView APK on pushes and PRs.
# Signed tag release APKs are built and attached to GitHub Releases by .github/workflows/release.yml.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'wxt.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'wxt.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Build Firefox MV3 extension
        run: |
          pnpm install --frozen-lockfile
          pnpm wxt build -b firefox

      - name: Run Android unit tests and lint
        working-directory: android
        run: |
          export XMRADAR_BUILD_OFFSET=$((GITHUB_RUN_NUMBER % 1000))
          ./gradlew testDebugUnitTest lintDebug --no-daemon

      - name: Build debug APK
        working-directory: android
        run: |
          export XMRADAR_BUILD_OFFSET=$((GITHUB_RUN_NUMBER % 1000))
          ./gradlew assembleDebug --no-daemon
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/*.apk dist-apk/
          (cd dist-apk && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xmradar-android-apk
          path: android/dist-apk/
          retention-days: 30
