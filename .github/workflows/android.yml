# Builds and unit-tests the standalone Android / GrapheneOS GeckoView APK on pushes and PRs.
# Signed tag release APKs are built and attached to GitHub Releases by .github/workflows/release.yml.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'wxt.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'wxt.config.ts'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      XMRADAR_BUILD_OFFSET: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.3.1

      - name: Build Firefox MV3 extension
        run: |
          pnpm install --frozen-lockfile
          pnpm wxt build -b firefox

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/*.apk dist-apk/
          (cd dist-apk && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xmradar-android-apk
          path: android/dist-apk/
          retention-days: 30
